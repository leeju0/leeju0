<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="150"
     viewBox="0 0 1200 150">

  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="55%" stop-color="#7DCFFF"/>
      <stop offset="100%" stop-color="#BB9AF7"/>
    </linearGradient>

    <clipPath id="typingClip">
      <rect id="typingRect" x="90" y="35" width="0" height="80" rx="2"/>
    </clipPath>
  </defs>

  <style>
    #typingRect {
      animation: typingReveal 8s steps(58, end) infinite;
    }

    #cursor {
      animation:
        cursorMove 8s steps(58, end) infinite,
        blink 0.8s step-end infinite;
    }

    @keyframes typingReveal {
      0%, 5% {
        width: 0px;
      }
      40% {
        width: 930px;
      }
      65% {
        width: 930px;
      }
      92% {
        width: 0px;
      }
      100% {
        width: 0px;
      }
    }

    @keyframes cursorMove {
      0%, 5% {
        transform: translateX(0px);
      }
      40% {
        transform: translateX(930px);
      }
      65% {
        transform: translateX(930px);
      }
      92% {
        transform: translateX(0px);
      }
      100% {
        transform: translateX(0px);
      }
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }
      51%, 100% {
        opacity: 0;
      }
    }
  </style>

  <!-- typed text -->
  <g clip-path="url(#typingClip)">
    <text
      x="90"
      y="92"
      font-family="Consolas, 'JetBrains Mono', monospace"
      font-size="34"
      font-weight="700"
      fill="url(#textGradient)"
      textLength="930"
      lengthAdjust="spacingAndGlyphs"
      xml:space="preserve">Hello! I'm AI Researcher &amp; Developer Juyoung Lee 😊</text>
  </g>

  <!-- cursor -->
  <rect
    id="cursor"
    x="90"
    y="58"
    width="4"
    height="42"
    rx="2"
    fill="#7DCFFF"
  />
</svg>
